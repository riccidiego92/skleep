name: WFL P43 Public Compute

on:
  push:
    branches:
      - "wfl-p43-public-compute"
    paths:
      - "queue/active_batch.json"

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      reps: ${{ steps.plan.outputs.reps }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/validate_public_bundle.py
      - id: plan
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          from wfl_compute.p43_p42_train_screen import registry_rows
          q=json.loads(Path("queue/active_batch.json").read_text())
          if q.get("schema")!="wfl-p43-public-batch-1":
              raise SystemExit("bad queue schema")
          bi=int(q["batch_index"]); bc=int(q["batch_count"])
          if bc != 8 or not 0 <= bi < 8:
              raise SystemExit("frozen public batch policy is 8 shards")
          stage=q["stage"]
          if stage=="member_confirmation":
              reps=2000
          elif stage=="final_train":
              reps=100000
          else:
              raise SystemExit("unknown stage")
          allowed=set(q.get("candidate_ids") or [])
          ids=sorted(r["candidate_id"] for r in registry_rows())
          if stage=="final_train":
              if not allowed:
                  raise SystemExit("final_train requires explicit frozen candidate_ids")
              ids=[x for x in ids if x in allowed]
              if set(ids)!=allowed:
                  raise SystemExit("final_train allowlist mismatch")
          selected=[cid for i,cid in enumerate(ids) if i % bc == bi]
          print("matrix="+json.dumps({"candidate_id":selected},separators=(",",":")))
          print("reps="+str(reps))
          PY

  evaluate:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run frozen P43 candidate
        env:
          CANDIDATE_ID: ${{ matrix.candidate_id }}
          REPS: ${{ needs.plan.outputs.reps }}
        run: |
          SAFE_ID="$(printf '%s' "$CANDIDATE_ID" | tr ':/' '__')"
          mkdir -p results
          python scripts/run_candidate.py "$CANDIDATE_ID" --reps "$REPS" --out "results/$SAFE_ID.json"
      - uses: actions/upload-artifact@v4
        with:
          name: p43-${{ strategy.job-index }}-${{ github.run_id }}
          path: results/*.json
          if-no-files-found: error
          retention-days: 1
